{% extends "base.html" %}
{% block title %}Report an Item - CampusFind{% endblock %}
{% block content %}
<div class="form-card">
    <p class="eyebrow">MAKE A REPORT</p><h1>Report a lost or found item</h1><p class="muted">Provide accurate details to help reunite the item with its owner.</p>
    <form method="POST" enctype="multipart/form-data">
        <label>Report type *</label><select name="listing_type" required><option value="">Select type</option><option value="lost" {% if selected_type == 'lost' %}selected{% endif %}>I lost an item</option><option value="found" {% if selected_type == 'found' %}selected{% endif %}>I found an item</option></select>
        <label>Item name *</label><input name="title" maxlength="150" required placeholder="Example: Black wallet">
        <label>Category *</label><select name="category_id" required><option value="">Select category</option>{% for category in categories %}<option value="{{ category.category_id }}">{{ category.category_name }}</option>{% endfor %}</select>
        <label>Description *</label><textarea name="description" rows="4" required placeholder="Describe the item and any identifying features."></textarea>
        <label>Location *</label><input name="location" maxlength="200" required placeholder="Example: College library">
        <label>Date lost / found *</label><input type="date" name="date_lost_found" required>
        <label>Photograph (optional)</label><input type="file" name="image" accept=".jpg,.jpeg,.png,.gif,.webp"><small>JPG, PNG, GIF or WEBP. Maximum 5 MB.</small>
        <button class="btn-primary" type="submit">Submit Report</button>
    </form>
</div>
{% endblock %}
