{% extends "base.html" %}
{% block title %}Login - CampusFind{% endblock %}
{% block content %}
<div class="auth-card">
    <p class="eyebrow">WELCOME BACK</p><h1>Sign in</h1><p class="muted">Access your CampusFind account.</p>
    <form method="POST">
        <label>Email address</label><input type="email" name="email" required value="{{ request.form.get('email','') }}">
        <label>Password</label><input type="password" name="password" required>
        <button class="btn-primary full-width" type="submit">Login</button>
    </form>
    <p class="form-foot">New to CampusFind? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
